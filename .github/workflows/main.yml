name: Dependabot Alerts Export

on:
  workflow_dispatch:
  schedule:
    # Every day at 03:15 UTC (adjust as needed)
    - cron: "15 3 * * *"

permissions:
  contents: read
  security-events: read

concurrency:
  group: dependabot-alerts-export
  cancel-in-progress: false

jobs:
  export:
    name: Export Dependabot alerts to CSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTPUT_CSV: reports/dependabot-alerts.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve repository metadata
        run: |
          echo "ORG_NAME=${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Create output directory
        run: mkdir -p "$(dirname "$OUTPUT_CSV")"

      - name: Export Dependabot alerts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const csvPath = process.env.OUTPUT_CSV;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const rows = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const headers = [
              'number',
              'state',
              'severity',
              'package',
              'ecosystem',
              'manifest_path',
              'created_at',
              'fixed_at',
              'dismissed_at',
              'html_url',
            ];

            const escapeCsv = (value) => {
              const text = value == null ? '' : String(value);
              const hasQuote = text.includes('"');
              const hasComma = text.includes(',');
              if (hasQuote || hasComma) {
                return `"${text.replace(/\r?\n/g, ' ').replace(/"/g, '""')}"`;
              }
              return text;
            };

            const lines = [headers.join(',')];
            for (const alert of rows) {
              lines.push(
                [
                  alert.number,
                  alert.state,
                  alert.security_vulnerability?.severity ?? '',
                  alert.dependency?.package?.name ?? '',
                  alert.dependency?.package?.ecosystem ?? '',
                  alert.dependency?.manifest_path ?? '',
                  alert.created_at,
                  alert.fixed_at ?? '',
                  alert.dismissed_at ?? '',
                  alert.html_url,
                ]
                  .map(escapeCsv)
                  .join(',')
              );
            }

            fs.writeFileSync(csvPath, lines.join('\n') + '\n', 'utf8');
            core.info(`Exported ${rows.length} Dependabot alerts to ${csvPath}`);

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-alerts-csv
          path: ${{ env.OUTPUT_CSV }}
          if-no-files-found: error
          retention-days: 30

      # OPTIONAL: commit the CSV back into the repo (disable if you prefer artifacts only)
      # If you enable this, you must also change permissions.contents to "write".
      # - name: Commit export to repository
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     mkdir -p reports
      #     # Move/rename as needed once you know the real output filename:
      #     # mv path/to/output.csv reports/dependabot-alerts.csv
      #     git add -A
      #     git commit -m "chore: update dependabot alerts export" || exit 0
      #     git push
